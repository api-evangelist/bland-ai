description: >-
  Bland AI is an enterprise-grade conversational voice AI platform for inbound and outbound
  phone agents. The Bland REST API covers calls, pathways (conversation graphs), voices and
  voice cloning, personas, tools, knowledge bases, dynamic data, transfer lists, and webhooks.
